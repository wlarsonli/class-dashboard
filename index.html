<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Class Dashboard</title>
  <meta name="description" content="Your classes, deadlines, and weekly plan.">
  <meta name="theme-color" content="#fbf7f3">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Classes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#today"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Class Dashboard</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-nav="today">Today</a>
      <a href="#week" data-nav="week">Week</a>
      <a href="#classes" data-nav="classes">Classes</a>
      <a href="#tasks" data-nav="tasks">Tasks</a>
      <a href="#settings" data-nav="settings">Settings</a>
    </nav>
    <button class="btn btn-primary new-btn" type="button" data-action="new-task">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>New task</span>
    </button>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>
  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-nav="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Today</span>
    </a>
    <a href="#week" data-nav="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Week</span>
    </a>
    <a href="#classes" data-nav="classes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 016.5 18H20v3H6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Classes</span>
    </a>
    <a href="#tasks" data-nav="tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l2 2 3.5-3.5M4 15l2 2 3.5-3.5M12.5 7.5H20M12.5 15.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Tasks</span>
    </a>
    <a href="#settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <dialog id="modal" class="sheet" aria-label="Editor"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
